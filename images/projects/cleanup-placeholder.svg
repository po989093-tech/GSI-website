<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540">
  <rect width="100%" height="100%" fill="#f7fff7"/>
  <g transform="translate(0,40)">
    <text x="24" y="28" font-family="Inter, Arial" font-size="20" fill="#0b5a2a">Community Cleanup — Informal Settlement</text>
    <!-- simple scene: buildings -->
    <g fill="#e9e9e9" stroke="#d1d1d1" stroke-width="1">
      <rect x="0" y="80" width="160" height="220" rx="6"/>
      <rect x="150" y="100" width="140" height="200" rx="6"/>
      <rect x="300" y="90" width="180" height="210" rx="6"/>
      <rect x="520" y="110" width="220" height="190" rx="6"/>
    </g>
    <!-- people silhouettes cleaning -->
    <g transform="translate(40,320)" fill="#0b5a2a">
      <circle cx="40" cy="-30" r="18"/>
      <rect x="24" y="-12" width="32" height="48" rx="6"/>
      <rect x="74" y="0" width="12" height="40" transform="rotate(-18 74 0)"/>
      <rect x="-6" y="0" width="12" height="40" transform="rotate(14 -6 0)"/>
    </g>
    <g transform="translate(160,320)" fill="#0b5a2a">
      <circle cx="40" cy="-26" r="16"/>
      <rect x="24" y="-8" width="32" height="46" rx="6"/>
      <rect x="64" y="8" width="14" height="36" transform="rotate(-12 64 8)"/>
    </g>
    <g transform="translate(420,320)" fill="#0b5a2a">
      <circle cx="40" cy="-28" r="17"/>
      <rect x="24" y="-10" width="32" height="46" rx="6"/>
    </g>
    <!-- trash bags and cleaned piles -->
    <g fill="#0e7a3a">
      <rect x="110" y="340" width="40" height="24" rx="6"/>
      <rect x="260" y="344" width="36" height="20" rx="6"/>
      <rect x="530" y="336" width="46" height="28" rx="8"/>
    </g>
  </g>
</svg>