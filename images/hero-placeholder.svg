<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#eaf6ec"/>
      <stop offset="1" stop-color="#d9efe0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" x2="1">
      <stop offset="0" stop-color="#0b5a2a"/>
      <stop offset="1" stop-color="#0e7a3a"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#0b2a12" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>

  <!-- distant tree line -->
  <g transform="translate(0,220)">
    <rect x="0" y="160" width="1600" height="380" fill="#f6fbf6"/>
    <g fill="#0b5a2a" opacity="0.95">
      <ellipse cx="200" cy="120" rx="160" ry="80"/>
      <ellipse cx="480" cy="110" rx="220" ry="100"/>
      <ellipse cx="820" cy="100" rx="260" ry="110"/>
      <ellipse cx="1180" cy="110" rx="200" ry="100"/>
      <ellipse cx="1440" cy="120" rx="160" ry="80"/>
    </g>
  </g>

  <!-- secure entrance (stylised gate & shield) -->
  <g transform="translate(350,160)">
    <rect x="0" y="0" width="900" height="360" rx="22" fill="#fff" filter="url(#sh)"/>
    <g transform="translate(36,24)">
      <!-- entrance path -->
      <path d="M10 280 L460 80 L890 280" fill="url(#g2)" opacity="0.12"/>
      <rect x="120" y="40" width="660" height="220" rx="18" fill="#f8fff8"/>
      <!-- gate lines -->
      <rect x="160" y="60" width="580" height="160" rx="12" fill="#f0f8f0"/>

      <!-- shield icon (placeholder echo of logo) -->
      <g transform="translate(320, -40) scale(1.0)">
        <path d="M80 8 C60 8 44 20 40 38 L40 120 C40 140 60 154 80 154 C100 154 120 140 120 120 L120 38 C116 20 100 8 80 8 Z" fill="#0b5a2a"/>
        <path d="M70 58 C76 52 92 50 102 58" stroke="#bfe8c9" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>

      <!-- subtle digital interface / scanner overlay -->
      <g opacity="0.75">
        <rect x="170" y="60" width="520" height="140" rx="10" fill="none" stroke="#9fd9b6" stroke-width="1" stroke-dasharray="6 8"/>
        <circle cx="420" cy="130" r="6" fill="#9fd9b6"/>
        <rect x="190" y="95" width="140" height="10" rx="6" fill="#9fd9b6" opacity="0.18"/>
        <rect x="360" y="95" width="220" height="10" rx="6" fill="#9fd9b6" opacity="0.12"/>
      </g>

      <!-- foreground vegetation -->
      <g transform="translate(40,220)" fill="#0e7a3a">
        <path d="M0 40 C20 10 40 10 60 40 C80 70 100 70 120 40 C140 10 160 10 180 40 L180 80 L0 80 Z"/>
      </g>
    </g>
  </g>

  <!-- caption area -->
  <g transform="translate(90,520)">
    <rect x="0" y="0" width="1420" height="140" rx="14" fill="#ffffff" opacity="0.92"/>
    <text x="36" y="44" font-family="Inter, Arial" font-size="28" fill="#083b1a">Building Resilient Communities. Protecting Our Environment.</text>
    <text x="36" y="84" font-family="Inter, Arial" font-size="16" fill="#365">A youth-led climate resilience and environmental sustainability programme under CAN-K.</text>
  </g>
</svg>